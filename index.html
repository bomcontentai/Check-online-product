<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotus's ID Checker</title>

<style>
body {
    background: linear-gradient(135deg, #e8f5ee 0%, #f7faf8 100%);
    font-family: 'Prompt', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
    color: #2e4d3f;
}

.container {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
}

textarea {
    width: 100%;
    min-height: 130px;
    border-radius: 12px;
    padding: 15px;
    border: 1px solid #cfe5d8;
    font-size: 15px;
}

button {
    margin-top: 15px;
    padding: 12px 30px;
    border-radius: 25px;
    border: none;
    background: #7fd3a6;
    color: #114d32;
    font-weight: bold;
    cursor: pointer;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px,1fr));
    gap: 15px;
    margin-top: 15px;
}

.product-card {
    background: #f1faf5;
    border-radius: 14px;
    padding: 15px;
    text-align: center;
    border: 1px solid #dcefe4;
}

.product-card img {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
}

.invalid-box {
    margin-top: 20px;
    background: #fff1f1;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #ffd6d6;
}

a {
    color: #1b6b4f;
    text-decoration: underline;
}

.note {
    font-size: 13px;
    opacity: 0.8;
    margin-top: 15px;
}
</style>

<!-- XLSX Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>

<body>
<div class="container">
    <h1>🛒 Lotus’s O2O SKU Checker</h1>
    <p>กรอกรหัสสินค้า SKU (คั่นรหัสด้วย Enter / , / เว้นวรรค)</p>

    <textarea id="input"></textarea>
    <button onclick="search()">ตรวจสอบ</button>

    <div id="resultBar" style="margin-top:15px;display:flex;align-items:center;gap:15px;">
        <div id="status" style="font-weight:bold;"></div>

        <button id="downloadBtn"
            onclick="downloadExcel()"
            style="display:none;background:#FF0073;color:#FFFFFF;">
            ดาวน์โหลด Excel แค่ Touch ก็ สัมผัสปอย
        </button>
    </div>

    <h3 style="margin-top:30px;">🔍 สินค้าที่ตรวจพบ</h3>
    <div class="product-grid" id="valid"></div>

    <div id="invalidBox" class="invalid-box" style="display:none;">
        <h3>⚠️ ไม่พบสินค้า</h3>
        <div id="invalidList"></div>
    </div>

    <div class="note">
        * ระบบใช้การตรวจสอบจากไฟล์รูปสินค้าโดยตรง<br>
        * หากพบรูป แปลว่ามีสินค้านั้นอยู่ในระบบ
    </div>
</div>

<script>

let globalNotFound = [];

function search() {

    const input = document.getElementById('input').value;
    const grid = document.getElementById('valid');
    const invalidBox = document.getElementById('invalidBox');
    const invalidList = document.getElementById('invalidList');
    const status = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');

    grid.innerHTML = '';
    invalidList.innerHTML = '';
    invalidBox.style.display = 'none';
    downloadBtn.style.display = 'none';

    globalNotFound = [];

    const ids = input
        .split(/[\s,]+/)
        .map(i => i.trim())
        .filter(i => /^\d+$/.test(i));

    let found = 0;

    ids.forEach(id => {

        const img = new Image();
        const imgUrl = `https://o2o-static.lotuss.com/products/86593/${id}.jpg`;
        const productUrl = `https://www.lotuss.com/th/product/${id}`;

        img.onload = () => {
            found++;
            grid.innerHTML += `
                <div class="product-card">
                    <img src="${imgUrl}" alt="product ${id}">
                    <strong>${id}</strong><br>
                    <a href="${productUrl}" target="_blank">
                        เปิดหน้าเว็บสินค้า
                    </a>
                </div>
            `;
            updateStatus();
        };

        img.onerror = () => {
            globalNotFound.push(id);
            updateStatus();
        };

        img.src = imgUrl;
    });

    function updateStatus() {

        status.innerText =
            `พบสินค้า ${found} | ไม่พบสินค้า ${globalNotFound.length}`;

        if (globalNotFound.length > 0) {
            invalidBox.style.display = 'block';
            invalidList.innerText = globalNotFound.join(', ');
            downloadBtn.style.display = 'inline-block';
        } else {
            downloadBtn.style.display = 'none';
        }
    }
}

function downloadExcel() {

    if (globalNotFound.length === 0) {
        alert("ไม่มีรายการที่ไม่พบสินค้า");
        return;
    }

    const data = globalNotFound.map((id, index) => ({
        "ลำดับ": index + 1,
        "SKU ที่ไม่พบ": id
    }));

    const worksheet = XLSX.utils.json_to_sheet(data);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "NotFound");

    XLSX.writeFile(workbook, "Lotus_NotFound_SKU.xlsx");
}

</script>

</body>
</html>
